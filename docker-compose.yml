version: "2.4"
services:
   mysqldb:
    container_name: mysqlcontainerfornanasensei
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
       - MYSQL_ROOT_PASSWORD=@Irfa2024!
       - MYSQL_DATABASE=nana_sensei
       - SERVICE_TAGS=prod
       - SERVICE_NAME=mysqldb
    ports:
       - 3306:3306
    expose:
       - 3307
    volumes:
       -  $HOME/database:/var/lib/mysql
    networks:
       - apinetwork
   dev-projetnanasenseimvc:  
     build: .
     image: tomcat-eb:v.9.0.17
     container_name: nanasenseimvc-project-container
     volumes:
        - ./webapp:/usr/local/tomcat/webapps/nanasenseimvc
     command: catalina.sh run
     ports:
        - 8081:8080
     restart: unless-stopped
     depends_on:
        - mysqldb
     networks:
        - apinetwork
networks:
   apinetwork:
      driver: bridge	    